<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <style>text{font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif}</style>
  <rect width="600" height="400" fill="#e9eef5"/>

  <!-- program monitor -->
  <rect x="40" y="26" width="520" height="176" rx="10" fill="#1d2636"/>
  <rect x="56" y="40" width="236" height="134" rx="4" fill="#000000"/>
  <text x="174" y="100" font-size="17" fill="#ffffff" text-anchor="middle">쇼츠를 멈추고,</text>
  <text x="174" y="126" font-size="17" fill="#ffffff" text-anchor="middle">페이지를 넘기다</text>
  <rect x="308" y="40" width="236" height="134" rx="4" fill="#3a4559"/>
  <!-- open magazine -->
  <path d="M340 150 L424 138 L424 70 L340 82 Z" fill="#f3f0e8"/>
  <path d="M424 138 L512 150 L512 82 L424 70 Z" fill="#fbf9f4"/>
  <g stroke="#cfc9bb" stroke-width="2">
    <line x1="352" y1="96" x2="412" y2="88"/><line x1="352" y1="106" x2="412" y2="98"/><line x1="352" y1="116" x2="400" y2="110"/>
    <line x1="352" y1="126" x2="412" y2="118"/>
  </g>
  <rect x="440" y="88" width="56" height="30" fill="#c8a6a0"/>
  <g stroke="#cfc9bb" stroke-width="2"><line x1="440" y1="128" x2="496" y2="134"/><line x1="440" y1="138" x2="484" y2="143"/></g>
  <path d="M478 156 q14 -22 30 -14 q10 6 4 20 z" fill="#e2c3ad"/>
  <text x="56" y="192" font-size="10" fill="#8fa3c2">PROGRAM</text>
  <text x="544" y="192" font-size="10" fill="#8fa3c2" text-anchor="end">00:00:12:08</text>

  <!-- timeline -->
  <rect x="40" y="214" width="520" height="160" rx="10" fill="#ffffff"/>
  <g font-size="9" fill="#8a94a6">
    <text x="84" y="232">00:00</text><text x="178" y="232">00:05</text><text x="272" y="232">00:10</text><text x="366" y="232">00:15</text><text x="460" y="232">00:20</text>
  </g>
  <line x1="80" y1="238" x2="548" y2="238" stroke="#e3e8ef"/>
  <g font-size="10" font-weight="700" fill="#667184"><text x="52" y="263">V2</text><text x="52" y="298">V1</text><text x="52" y="340">A1</text></g>

  <rect x="120" y="248" width="88" height="24" rx="4" fill="#445d84"/>
  <text x="128" y="264" font-size="10" fill="#ffffff">타이틀 카드</text>

  <rect x="82" y="282" width="128" height="26" rx="4" fill="#9aabc4"/>
  <text x="90" y="299" font-size="10" fill="#ffffff">숏폼 화면</text>
  <rect x="214" y="282" width="212" height="26" rx="4" fill="#677fa4"/>
  <text x="222" y="299" font-size="10" fill="#ffffff">잡지를 넘기는 손</text>
  <rect x="430" y="282" width="116" height="26" rx="4" fill="#9aabc4"/>
  <text x="438" y="299" font-size="10" fill="#ffffff">엔딩</text>

  <!-- audio waveform -->
  <rect x="82" y="320" width="464" height="34" rx="4" fill="#eef2f7"/>
  <path id="wave" d="M86 337 h4 v-6 h3 v12 h3 v-16 h3 v20 h3 v-12 h3 v6 h3 v-10 h3 v14 h3 v-18 h3 v22 h3 v-14 h3 v8 h3 v-4 h3 v2 h3 v-2 h3 v4 h3 v-2 h3 v2 h3 v-2 h3 v2 h3 v-2 h3 v2 h3 v-6 h3 v10 h3 v-14 h3 v18 h3 v-20 h3 v22 h3 v-16 h3 v12 h3 v-18 h3 v20 h3 v-10 h3 v6 h3 v-12 h3 v16 h3 v-20 h3 v22 h3 v-14 h3 v10 h3 v-8 h3 v6 h3 v-12 h3 v16 h3 v-10 h3 v6 h3 v-14 h3 v18 h3 v-16 h3 v12 h3 v-8 h3 v6 h3 v-10 h3 v12 h3 v-16 h3 v18 h3 v-12 h3 v8 h3 v-6 h3 v4" fill="none" stroke="#8197b7" stroke-width="1.6"/>
  <clipPath id="wclip"><rect x="82" y="320" width="460" height="34"/></clipPath>
  <g clip-path="url(#wclip)"><use href="#wave" x="186"/><use href="#wave" x="372"/></g>

  <!-- playhead at the turning point -->
  <line x1="212" y1="242" x2="212" y2="364" stroke="#d9714e" stroke-width="2"/>
  <path d="M206 240 h12 l-6 8 z" fill="#d9714e"/>
  <rect x="220" y="250" width="54" height="18" rx="9" fill="#d9714e"/>
  <text x="247" y="263" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">전환점</text>
</svg>
