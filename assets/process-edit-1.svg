<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <style>text{font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif}</style>
  <rect width="600" height="400" fill="#e9eef5"/>
  <!-- paper -->
  <rect x="46" y="42" width="520" height="330" rx="12" fill="#d6dee9"/>
  <rect x="40" y="34" width="520" height="330" rx="12" fill="#ffffff"/>
  <text x="64" y="68" font-size="15" font-weight="700" fill="#243042">탈피 · 이야기 노트</text>
  <text x="536" y="68" font-size="10" font-weight="700" fill="#677fa4" letter-spacing="1.5" text-anchor="end">STORY NOTES</text>
  <line x1="64" y1="82" x2="536" y2="82" stroke="#e3e8ef"/>

  <!-- character cards -->
  <rect x="64" y="98" width="182" height="92" rx="10" fill="#f4f6fa" stroke="#d7dfeb"/>
  <circle cx="94" cy="128" r="15" fill="#c4d2e5"/>
  <text x="118" y="125" font-size="15" font-weight="700" fill="#243042">나</text>
  <text x="118" y="143" font-size="11" fill="#667184">재수 시절을 지나 교사가 됨</text>
  <rect x="80" y="160" width="140" height="6" rx="3" fill="#dfe5ee"/>
  <rect x="80" y="172" width="96" height="6" rx="3" fill="#dfe5ee"/>

  <rect x="354" y="98" width="182" height="92" rx="10" fill="#f4f6fa" stroke="#d7dfeb"/>
  <circle cx="384" cy="128" r="15" fill="#c4d2e5"/>
  <text x="408" y="125" font-size="15" font-weight="700" fill="#243042">여학생</text>
  <text x="408" y="143" font-size="11" fill="#667184">그 시절의 나를 닮은 인물</text>
  <rect x="370" y="160" width="140" height="6" rx="3" fill="#dfe5ee"/>
  <rect x="370" y="172" width="110" height="6" rx="3" fill="#dfe5ee"/>

  <!-- mirror link -->
  <line x1="254" y1="146" x2="346" y2="146" stroke="#445d84" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M254 146 l8 -5 v10z M346 146 l-8 -5 v10z" fill="#445d84"/>
  <text x="300" y="134" font-size="11" font-weight="700" fill="#445d84" text-anchor="middle">거울처럼 닮음</text>

  <!-- emotion line -->
  <text x="64" y="222" font-size="11" font-weight="700" fill="#243042">감정선</text>
  <text x="112" y="222" font-size="10" fill="#8197b7">장면별로 인물이 머무는 감정</text>
  <line x1="64" y1="318" x2="536" y2="318" stroke="#d7dfeb"/>
  <line x1="64" y1="238" x2="64" y2="318" stroke="#d7dfeb"/>
  <polyline points="104,300 210,276 316,292 422,252 512,236" fill="none" stroke="#445d84" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#ffffff" stroke="#445d84" stroke-width="2.5">
    <circle cx="104" cy="300" r="5"/><circle cx="210" cy="276" r="5"/><circle cx="316" cy="292" r="5"/><circle cx="422" cy="252" r="5"/><circle cx="512" cy="236" r="6" fill="#445d84"/>
  </g>
  <g font-size="11" fill="#667184" text-anchor="middle">
    <text x="104" y="338">불안</text><text x="210" y="338">만남</text><text x="316" y="338">마주함</text><text x="422" y="338">치유</text><text x="512" y="338" font-weight="700" fill="#445d84">성장</text>
  </g>
</svg>
